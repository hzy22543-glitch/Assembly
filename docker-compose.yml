services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./server/data:/app/data
    restart: always
    environment:
      - PORT=3000
      - SANDBOX_URL=http://asm-sandbox:5000

  asm-sandbox:
    extends:
      file: sandbox/docker-compose.sandbox.yml
      service: asm-sandbox
    profiles:
      - sandbox
